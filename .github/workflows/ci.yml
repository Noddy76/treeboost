name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Verify License Headers
        if: runner.os == 'Linux'
        run: make check-license

      - name: Run Go Vet
        run: go vet ./...

      - name: Verify Generated Assembly is In Sync
        if: runner.os == 'Linux'
        run: |
          go generate ./...
          git diff --exit-code || (echo "Generated assembly files are out of date. Please run 'go generate ./...' locally." && exit 1)

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Run Unit Tests with Race Detector
        if: runner.os != 'Windows'
        run: go test -v -race ./...

      - name: Verify Benchmarks Compile & Run
        run: go test -v -bench=. -benchtime=1x -run=^$ ./...
